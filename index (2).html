<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Manual de diseño de servicios y directorio de restaurantes y antros de Grupo Alme."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🦉%3C/text%3E%3C/svg%3E"><title>Grupo Alme · Manual de diseño de servicios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0a0a0b;--card:#141415;--tx:#eee8dc;--mu:#a8a296;--ac:#f1e7cf;--go:#c9a96a;--bd:#2b2a28;--hi:#1c1b19;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.7 "Cormorant Garamond",Georgia,"Times New Roman",serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(8,8,9,.9),rgba(8,8,9,.95)),var(--bgi) center/cover}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(10,10,11,.92);border-bottom:1px solid var(--bd)}
header b{flex:1;font:500 13px "Montserrat",system-ui,sans-serif;letter-spacing:.34em;color:var(--go);cursor:pointer}
button,.btn{font:500 12px "Montserrat",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border:1px solid var(--go);background:transparent;color:var(--tx);padding:13px 20px;text-decoration:none;display:inline-block}
.btn.p{background:var(--go);color:#111}
#menu{font-size:20px;padding:4px 12px;letter-spacing:0;border-color:var(--bd)}
nav{position:fixed;inset:0 auto 0 0;width:min(80vw,310px);background:#101011;border-right:1px solid var(--bd);transform:translateX(-105%);transition:transform .2s;z-index:9;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px;font-family:"Montserrat",system-ui,sans-serif}
nav.o{transform:none}nav h3{margin:0 0 14px;color:var(--go);font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
nav a{display:block;padding:13px 10px;color:var(--tx);text-decoration:none;font-size:13px;letter-spacing:.08em}nav a.on{color:var(--go);border-left:2px solid var(--go)}
#sh{position:fixed;inset:0;background:#000a;z-index:8;display:none}#sh.o{display:block}
main{max-width:800px;margin:0 auto;padding:22px 20px 70px}main.wide{max-width:none;padding:0}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ac);font-weight:600}
h1{font-size:36px;line-height:1.15;margin:8px 0;letter-spacing:.03em}h2{font-size:27px;margin:4px 0 16px}
a{color:var(--go)}h3{color:var(--go);font:500 12px "Montserrat",system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:24px 0 8px}
.sub{color:var(--mu);font:400 13px "Montserrat",system-ui,sans-serif;letter-spacing:.06em}
.grp{margin:26px 0 10px;font:500 11px "Montserrat",system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--go)}
.it{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:0 0 8px;padding:15px 18px;font:500 20px "Cormorant Garamond",Georgia,serif;letter-spacing:.02em;text-transform:none;border-color:var(--bd);background:rgba(20,20,21,.75)}
.it span{color:var(--go)}.it:hover{border-color:var(--go)}
p{text-align:justify;margin:0 0 15px}
table{width:100%;border-collapse:collapse;font:400 14px/1.5 "Montserrat",system-ui,sans-serif;margin:6px 0 18px}
.tw{overflow-x:auto}th{background:var(--go);color:#111;padding:10px;text-align:left;font-weight:600;letter-spacing:.06em}td{padding:10px;border:1px solid var(--bd);vertical-align:top;background:rgba(20,20,21,.7)}
.ax{background:rgba(20,20,21,.8);border-left:2px solid var(--go);padding:13px 16px;margin:0 0 12px;text-align:justify}
.nv{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
.card{text-align:left;padding:18px;font:600 22px "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;text-transform:none;color:var(--ac);border-color:var(--bd);background:rgba(20,20,21,.8)}
.card:hover{border-color:var(--go)}.card small{display:block;font:400 12px "Montserrat",system-ui,sans-serif;letter-spacing:.04em;color:var(--mu);margin-top:5px}
dl{margin:18px 0;font-family:"Montserrat",system-ui,sans-serif}dt{font-weight:500;color:var(--go);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:18px}dd{margin:4px 0 0;font-size:14.5px;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.warn{border:1px solid var(--bd);padding:11px 15px;font:13px/1.55 "Montserrat",system-ui,sans-serif;color:var(--mu);margin-top:14px}
.hero{min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background-size:cover;background-position:center}
.logo{width:min(260px,62vw);height:auto;margin-bottom:6px;mix-blend-mode:screen}
.brand{font-size:clamp(40px,12.5vw,110px);letter-spacing:.2em;text-indent:.2em;font-weight:500;color:#f5edd9;margin:6px 0 4px;line-height:1.05}
.tag{text-align:center;color:var(--go);font:400 12px "Montserrat",system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;margin:6px 0 30px}
.row2{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.col{max-width:920px;margin:0 auto;padding:30px 18px 70px}
.collage{grid-auto-flow:dense;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;gap:8px}
.collage img{width:100%;height:100%;object-fit:cover;display:block;border:1px solid var(--bd)}
.collage .t{grid-row:span 2}.collage .w{grid-column:span 2}
@media(max-width:560px){.collage{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px}.collage .w{grid-column:span 2}}
.wm{text-align:center;padding:14px 0 6px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.wm img{width:96px;height:auto;mix-blend-mode:screen}
.wm div{font:500 clamp(26px,8vw,44px) "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:var(--ac);margin-top:4px}
.wm .sub{margin-top:2px}
</style></head><body>

["Introducción","1. Introducción al documento","<p>Este manual analiza el servicio de Grupo Alme desde la Ciencia de los Servicios, la disciplina que estudia cómo se diseñan, se entregan y se mejoran los servicios para crear valor, tanto para la empresa como para el cliente que los vive. Lo escribimos pensando en cualquier persona, aunque no sepa nada del tema, y por eso explicamos cada concepto con palabras sencillas y ejemplos de cómo funciona el grupo en el día a día.</p><p>En las siguientes páginas se encuentra, primero, una descripción de la empresa y de la experiencia que ofrece. Después hay una introducción a los servicios, con sus características y la forma en que el negocio pasó de vender un producto a ofrecer una experiencia. Al final se explica la lógica dominante del servicio y sus premisas aplicadas a Grupo Alme, que es la idea que conecta todo el manual.</p>"],
["Quiénes son","2. La empresa: Grupo Alme","<p>Grupo Alme es un grupo familiar mexicano dedicado a la gastronomía y el entretenimiento, fundado por el empresario Juan Altamirano. Tiene más de una década de trayectoria en el sector restaurantero, desde aproximadamente 2011 (Grupo Alme, 2026). Es una empresa 100% familiar en la que participan los familiares del fundador en áreas como arquitectura, cocina y operación (Grupo Alme, 2026). En la apertura de La Madalena en Cancún, por ejemplo, se destacó que el diseño arquitectónico estuvo a cargo del patriarca de la familia y que los postres son creación de la matriarca (Riviera Maya News, s.f.).</p><p>Su misión es que cada concepto integre las raíces mexicanas, un servicio de excelencia y algunos de los spots más especiales de la gastronomía y el entretenimiento del país (Grupo Alme, 2026). Sus restaurantes llevan el sello, el sabor y la frescura de ingredientes nacionales, combinados con productos de importación (como los de Japón, Alaska o Chile) para darle un giro a la cocina tradicional. El grupo se sostiene en tres pilares que son valores de familia: <b>atender, compartir y servir</b>, compartidos con todos los colaboradores para que el cliente se sienta en un ambiente familiar.</p><p>Según su página oficial, hoy reúne 16 conceptos: Azia, Ánima, Beluga, Isabela, La Madalena, Six, Strana, Casitas Mariaka, Cristina, Code, Más Salsa, Meza, Sham Burgers!, La Pesca, Dumbo Hi-Fi y Colette. Puedes consultarlos en la sección “Restaurantes y antros”.</p><div class=tw><table><tr><th>Ficha</th><th></th></tr><tr><td>Fundador</td><td>Juan Altamirano</td></tr><tr><td>Origen del nombre</td><td>La Madalena rinde homenaje a la abuela de la familia, María Magdalena, y se basa en recetas familiares tradicionales.</td></tr><tr><td>Presencia</td><td>Guadalajara, Cancún, Puerto Vallarta, Monterrey, Tepic y Ciudad de México.</td></tr></table></div>"],
["El servicio y la experiencia","2. La empresa: servicio y experiencia","<p>Cuando alguien va a La Madalena, Beluga o Azia, no solo está comprando comida o una bebida, sino un servicio de hospitalidad completo. Ahí entran el recibimiento del host, la atención del mesero, el DJ en vivo, la iluminación, los platillos que el chef prepara al momento y el ambiente del lugar. La comida es importante, pero es solo una parte de algo más grande: la experiencia de pasar la noche en el restaurante.</p><p>A diferencia de las cadenas que repiten el mismo formato en todas sus sucursales, Grupo Alme crea conceptos con identidad propia. Cada uno tiene su cocina, su diseño y su ambiente, pero todos comparten los valores de la familia: atender, compartir y servir (Grupo Alme, 2026). Lo que los hace diferentes es la combinación de raíces mexicanas, toques internacionales en la cocina, espacios diseñados por la propia familia y un trato pensado para que el cliente se sienta como en casa.</p>"],
["Concepto de servicio","3. Introducción a los servicios","<p>Un servicio es una actividad que busca satisfacer las necesidades de un cliente mediante la atención, los conocimientos y la experiencia. A diferencia de un producto físico, no se puede guardar ni llevar a casa de la misma manera, porque gran parte de su valor está en cómo se siente y en la atención que recibe la persona.</p><p>En Grupo Alme, el servicio no consiste únicamente en preparar y vender alimentos: también incluye recibir a los clientes, atenderlos durante su visita, cuidar el ambiente y ofrecerles un espacio para convivir y disfrutar. La empresa señala en su página oficial que busca ofrecer un servicio de excelencia y crear experiencias especiales en cada concepto.</p><p>Por ejemplo, cuando fui a Cristina, noté que la atención y la hospitalidad forman parte de la experiencia desde que entras. Aunque no se pueden tocar, sí se notan en el trato del personal y en cómo te hacen sentir. Desde la perspectiva de Pine y Gilmore (1998, p. 97), las empresas pueden diferenciarse al crear experiencias memorables: un negocio no solo debe preocuparse por lo que vende, sino por lo que vive el cliente mientras recibe el servicio.</p>"],
["Características","3. Características de los servicios","<p>Los servicios tienen cuatro características principales: intangibilidad, inseparabilidad, heterogeneidad y carácter perecedero (Zeithaml et al., 1985). Ayudan a entender por qué la experiencia del cliente depende de varios elementos además de la comida.</p><div class=tw><table><tr><th>Característica</th><th>Definición</th><th>En Grupo Alme</th></tr><tr><td>Intangibilidad</td><td>No se puede tocar ni probar completamente antes de recibirlo.</td><td>En Cristina, la hospitalidad se percibe por el trato del personal y el ambiente, aunque no se pueda tocar.</td></tr><tr><td>Inseparabilidad</td><td>Se produce y se consume al mismo tiempo; el cliente participa.</td><td>En La Madalena, la atención, la preparación de los alimentos y la interacción en la mesa suceden durante la visita.</td></tr><tr><td>Heterogeneidad</td><td>Cambia según el personal, el momento y el cliente.</td><td>Ánima se relaciona con el entorno natural y la playa; Cristina ofrece un ambiente acogedor de desayunos y panadería. Cada cliente lo vive distinto.</td></tr><tr><td>Carácter perecedero</td><td>No se puede almacenar; la capacidad no usada se pierde.</td><td>Una mesa vacía en La Madalena en hora de alta demanda es una oportunidad de servicio que no se recupera.</td></tr></table></div><p>Por eso administrar un restaurante de Grupo Alme es diferente a administrar una fábrica: no basta con buenos ingredientes, también hay que organizar al personal, atender a los clientes y cuidar el ambiente.</p>"],
["Evolución","3. Evolución: del producto al servicio","<p><b>El producto tradicional.</b> Antes se podía pensar que el principal producto de un restaurante era la comida: el cliente acudía para satisfacer una necesidad básica, alimentarse, y el valor estaba en los ingredientes, el sabor y la cantidad. En Grupo Alme la propuesta va más allá: su página oficial destaca la hospitalidad, la calidad y el cuidado de los espacios.</p><p><b>La transformación hacia el servicio.</b> Pine y Gilmore (1998) explican que las empresas pueden diferenciarse al ofrecer experiencias que las personas recuerden. En Grupo Alme se observa en tres aspectos:</p><div class=ax><b>El plato como parte de la experiencia.</b> La Madalena destaca por su propuesta gastronómica centrada en cortes y por una experiencia donde la comida forma parte de una ocasión especial.</div><div class=ax><b>El ambiente como parte del servicio.</b> Ánima, en Puerto Vallarta, combina el entorno natural de la costa con la gastronomía y el diseño de sus espacios; Cristina tiene un ambiente acogedor con café y panadería.</div><div class=ax><b>Una atención más personalizada.</b> Un mesero que conoce el menú y responde a las necesidades del cliente mejora su experiencia. En mi experiencia en Cristina noté la importancia del trato desde la entrada.</div><p>En resumen, Alme pasó de vender comida a diseñar noches: mientras el producto resuelve el deseo de comer, el servicio resuelve el deseo de vivir algo especial esa noche.</p>"],
["Fundamentos","4. Lógica dominante del servicio","<p>La lógica dominante del servicio, propuesta por Vargo y Lusch (2004), explica que los negocios no deben enfocarse solo en vender productos, sino en cómo usan sus conocimientos y habilidades para ayudar a sus clientes. No se trata únicamente de lo que compras, sino de lo que la empresa hace para ofrecerte valor.</p><p>Cuando una persona visita un restaurante de Grupo Alme, no solo paga por la comida y las bebidas: también recibe atención del personal, disfruta el diseño del lugar y convive con otras personas. Los alimentos, las bebidas y las instalaciones son medios para ofrecer esa experiencia, y el cliente participa con sus decisiones y preferencias. Por eso el valor no depende solo de lo que ofrece la empresa, sino de cómo lo vive cada persona.</p>"],
["Axiomas","4. Las premisas del servicio","<p>Los cinco axiomas (Vargo y Lusch, 2016) aplicados a Alme:</p><div class=ax><b>Axioma 1 (FP1): el servicio es la base del intercambio.</b> Lo que Alme da a sus clientes no es solo comida o bebida, sino un servicio de excelencia; la comida es el medio.</div><div class=ax><b>Axioma 2 (FP6): el valor se co-crea entre varios actores, incluido siempre el beneficiario.</b> La experiencia en Beluga, Azia o Strana depende también del cliente: con quién va, qué pide y cómo se relaciona con el lugar.</div><div class=ax><b>Axioma 3 (FP9): todos los actores integran recursos.</b> El cliente junta lo que Alme le ofrece con su tiempo, su compañía, la ocasión que celebra y su estado de ánimo.</div><div class=ax><b>Axioma 4 (FP10): el valor lo define el beneficiario, de forma única y subjetiva.</b> Una cena en La Madalena puede ser una celebración inolvidable para una persona y solo una salida más para otra.</div><div class=ax><b>Axioma 5 (FP11): la co-creación se coordina con instituciones y reglas del juego.</b> Los protocolos de atención, la cultura de “atender, compartir y servir” y las reglas de cada concepto (reservaciones, código de vestimenta) hacen que la experiencia sea consistente.</div>"],
["Premisas complementarias","4. Premisas complementarias","<div class=tw><table><tr><th>Premisa</th><th>En Grupo Alme</th></tr><tr><td>FP2. El intercambio indirecto oculta la base del intercambio</td><td>Detrás de una cena intervienen cocineros, proveedores, capitanes, bartenders y músicos; esa red queda oculta y el cliente percibe un solo servicio.</td></tr><tr><td>FP3. Los bienes son un mecanismo de distribución del servicio</td><td>Platillos, bebidas y espacios son el medio por el que llegan la atención, el ambiente y la convivencia.</td></tr><tr><td>FP4. Los recursos operantes son la fuente de ventaja estratégica</td><td>Las recetas familiares, la técnica de los chefs, el diseño de los espacios y el entrenamiento del personal.</td></tr><tr><td>FP5. Todas las economías son economías de servicio</td><td>Aunque trabajan con ingredientes, los restaurantes compiten por la calidad de la atención y la experiencia.</td></tr><tr><td>FP7. Los actores solo proponen valor</td><td>Alme propone menú, ambiente y atención; el valor se concreta cuando el cliente lo aprovecha.</td></tr><tr><td>FP8. La visión de servicio es relacional y centrada en el beneficiario</td><td>Atender, compartir y servir se traducen en un trato cercano que busca una relación más allá de una visita.</td></tr></table></div><p>En conjunto, para Alme el éxito no depende solo de tener buena comida, sino de diseñar bien todo lo que rodea la visita y dejar espacio para que cada cliente construya su propia experiencia.</p>"],
["Emociones","5. Las emociones dentro de los servicios","<p>Las siguientes tablas muestran el recorrido (journey) del cliente en un restaurante y en un antro de Grupo Alme: los puntos de contacto, la emoción que se vive en cada etapa y el elemento del servicio que la provoca.</p><h3>Restaurante</h3><div class=tw><table><tr><th>Etapa</th><th>Reserva</th><th>Llega</th><th>Ordena</th><th>Recibe comida</th></tr><tr><td><b>Puntos de contacto</b></td><td>Google / WhatsApp</td><td>Recepcionista</td><td>Mesero</td><td>Platillo</td></tr><tr><td><b>Journey</b></td><td>Reserva mesa</td><td>Llega y lo llevan a su mesa</td><td>Ordena comida y bebida</td><td>Recibe su platillo</td></tr><tr><td><b>Emociones</b></td><td>Emocionado</td><td>Nervioso</td><td>Confiado</td><td>Feliz</td></tr><tr><td><b>Elemento que proporciona la emoción</b></td><td>Confirmación rápida de la reserva</td><td>Que lo reciban por su nombre y sin esperar</td><td>Que el mesero recomiende platillos</td><td>Que el platillo llegue rápido y bien presentado</td></tr></table></div><h3>Antro</h3><div class=tw><table><tr><th>Etapa</th><th>Reserva</th><th>Fila</th><th>Entra</th><th>Pide bebida</th></tr><tr><td><b>Puntos de contacto</b></td><td>Instagram / WhatsApp</td><td>Cadenero</td><td>Mesero</td><td>Bebida</td></tr><tr><td><b>Journey</b></td><td>Se anota en la lista</td><td>Espera en la fila</td><td>Pasa la revisión y entra</td><td>Pide su bebida</td></tr><tr><td><b>Emociones</b></td><td>Emocionado</td><td>Ansioso</td><td>Aliviado</td><td>Feliz</td></tr><tr><td><b>Elemento que proporciona la emoción</b></td><td>Confirmación rápida de la reserva</td><td>Fila grande y que haya muchos esperando a pasar</td><td>Trato respetuoso de seguridad</td><td>Que la bebida llegue rápido y buena atención</td></tr></table></div>"],
["LDS y recursos","6. Ecosistemas de servicios (1/2)","<h3>Fundamentos de la lógica dominante del servicio</h3><p>La Lógica Dominante del Servicio explica que el valor no se encuentra solamente en el producto que compra una persona, sino también en el servicio, los conocimientos, las experiencias y la interacción entre los participantes. En el caso de Grupo Alme, el valor no depende únicamente de la comida o las bebidas, sino también de la atención, el ambiente, el diseño del lugar y la experiencia que vive cada cliente.</p><p>Desde esta perspectiva, los clientes, los empleados, los proveedores y la empresa participan en la creación de valor. Cada uno aporta recursos que ayudan a construir la experiencia final (Vargo &amp; Lusch, 2004, 2008).</p><h3>Redes actor a actor</h3><p>Las redes actor a actor se refieren a las relaciones entre diferentes participantes que intercambian recursos y colaboran para crear valor. Estos participantes pueden ser personas, empresas u organizaciones.</p><p>En Grupo Alme, estas redes se observan en la relación entre la empresa, sus empleados, proveedores, clientes y otros colaboradores. Por ejemplo, los proveedores proporcionan los ingredientes y las bebidas, los empleados preparan los alimentos y atienden a los clientes, y los clientes participan al elegir productos, comunicar sus preferencias y compartir sus opiniones. Todos estos actores se relacionan para que el servicio funcione correctamente y la experiencia sea satisfactoria.</p><h3>Licuefacción de recursos</h3><p>La licuefacción de recursos consiste en convertir recursos que antes estaban limitados a una forma física o a una persona en información que puede compartirse y utilizarse de diferentes maneras.</p><p>En Grupo Alme, esto puede verse en el uso de herramientas digitales para consultar menús, gestionar reservaciones, registrar preferencias y compartir opiniones de los clientes. Por ejemplo, la información obtenida de las reservaciones o de los comentarios en internet puede ayudar a la empresa a conocer mejor a sus clientes y mejorar la atención. De esta manera, la información se convierte en un recurso que ayuda a tomar decisiones y mejorar el servicio.</p><h3>Densidad de recursos</h3><p>La densidad de recursos se refiere a la capacidad de reunir y aprovechar diferentes recursos para resolver una necesidad en un momento y lugar determinados.</p><p>En Grupo Alme, se presenta cuando se combinan los alimentos, las bebidas, la atención del personal, la música, la iluminación, el diseño del espacio y la organización del servicio. Estos recursos trabajan juntos para ofrecer una experiencia completa. Por ejemplo, en un restaurante del grupo, una cena no depende solamente de la calidad de los alimentos, sino también del ambiente, el tiempo de atención y la manera en que el personal responde a las necesidades del cliente.</p><h3>Integración de recursos</h3><p>La integración de recursos consiste en combinar diferentes recursos para crear un beneficio o una experiencia de valor. Los recursos pueden ser materiales, como los alimentos y las instalaciones, o intangibles, como el conocimiento, la experiencia y las habilidades del personal.</p><p>En Grupo Alme, la integración ocurre cuando se combinan los ingredientes, la preparación de los alimentos, la atención de los empleados, la tecnología y el diseño del establecimiento para ofrecer el servicio. Además, el cliente también aporta recursos, como sus preferencias, expectativas y experiencias anteriores. La combinación de todos estos elementos contribuye a que cada visita sea diferente y tenga valor para el consumidor.</p>"],
["El ecosistema y sus elementos","6. Ecosistemas de servicios (2/2)","<h3>Ecosistema de servicios</h3><p>Un ecosistema de servicios es una red de participantes que se relacionan, comparten recursos y siguen ciertas reglas para crear valor. No depende únicamente de una empresa, sino de la colaboración entre diferentes actores, como empleados, clientes, proveedores y otras organizaciones (Lusch &amp; Nambisan, 2015).</p><p>En Grupo Alme, el ecosistema está formado por la empresa, sus restaurantes y bares, los empleados, los proveedores y los clientes. Todos participan de alguna manera en la experiencia gastronómica. Para que el servicio funcione, es necesario coordinar las actividades, compartir información y mantener una buena relación entre los participantes.</p><h3>Flexibilidad estructural</h3><p>La flexibilidad estructural es la capacidad de una red de participantes para reorganizarse y adaptarse a diferentes situaciones o necesidades. En Grupo Alme, esto se puede observar cuando el personal modifica la organización de sus actividades según la cantidad de clientes, las reservaciones o las necesidades de un evento. Por ejemplo, si aumenta la demanda durante una noche, el restaurante puede ajustar la distribución de las mesas y las actividades del personal para atender mejor a los clientes. Esta flexibilidad permite responder a los cambios sin perder la calidad del servicio.</p><h3>Integridad estructural</h3><p>La integridad estructural se refiere a las relaciones que mantienen unidos a los participantes de un ecosistema y permiten que trabajen de manera coordinada. En Grupo Alme, se refleja en la comunicación entre la cocina, los meseros, los encargados y los proveedores. Si cada área cumple con sus responsabilidades y comparte la información necesaria, el servicio puede desarrollarse correctamente.</p><p>Por ejemplo, cuando un cliente realiza una reservación, es importante que el personal conozca los detalles para preparar el espacio y ofrecer una atención adecuada. La coordinación entre las áreas ayuda a evitar errores y mejora la experiencia.</p><h3>Distancia cognitiva</h3><p>La distancia cognitiva se refiere a las diferencias de conocimientos, habilidades y formas de pensar que existen entre los participantes de una red. En Grupo Alme, cada participante tiene conocimientos diferentes. Los cocineros conocen la preparación de los alimentos, los meseros saben cómo atender a los clientes, los administradores organizan las operaciones y los clientes tienen sus propias preferencias y expectativas.</p><p>Estas diferencias pueden ser útiles porque cada persona aporta conocimientos distintos. Sin embargo, también pueden causar problemas si no existe una buena comunicación. Por eso, es importante que las áreas comprendan sus responsabilidades y trabajen hacia un mismo objetivo.</p><h3>Visión cognitiva compartida</h3><p>La visión cognitiva compartida consiste en que los participantes tengan una idea común de lo que buscan lograr, aunque sus conocimientos y actividades sean diferentes. En Grupo Alme, esta visión puede reflejarse en el objetivo de ofrecer una experiencia gastronómica satisfactoria, con buena atención, alimentos de calidad y un ambiente adecuado.</p><p>Por ejemplo, aunque el chef, el mesero y el gerente realizan actividades distintas, todos deben entender que su trabajo contribuye a la experiencia del cliente. Compartir este objetivo facilita la comunicación y la toma de decisiones.</p><h3>Arquitectura de participación</h3><p>La arquitectura de participación es la manera en que se organizan las reglas, responsabilidades y formas de colaboración entre los participantes de un ecosistema. En Grupo Alme, se refleja en la distribución de funciones entre el personal, la coordinación de las áreas y los procedimientos que permiten atender a los clientes. También incluye los medios por los que los clientes pueden participar, como realizar reservaciones, solicitar cambios en sus pedidos o compartir comentarios sobre el servicio.</p><p>Una arquitectura de participación bien organizada permite que cada actor sepa qué hacer y cómo colaborar con los demás para mejorar la experiencia (Lusch &amp; Nambisan, 2015).</p><h3>Relación entre los conceptos y Grupo Alme</h3><p>Los fundamentos de la LDS y los elementos de los ecosistemas de servicios están relacionados entre sí. En Grupo Alme, los empleados, proveedores y clientes forman una red de actores; comparten información; combinan recursos y se organizan para ofrecer una experiencia gastronómica.</p><p>La flexibilidad permite adaptarse a los cambios, la integridad mantiene la coordinación, la visión compartida orienta el trabajo y la arquitectura de participación establece cómo colaboran los actores. En conjunto, estos elementos ayudan a entender que el valor del servicio no depende solamente de los alimentos, sino de la interacción entre todos los participantes.</p>"],
["Plataforma","6. Ecosistemas: plataforma","<p>Dentro de un ecosistema, los actores necesitan una estructura que les facilite encontrarse e intercambiar recursos. A esa estructura se le llama plataforma de servicio: una estructura modular que combina recursos tangibles e intangibles y que facilita la interacción entre actores y recursos (Lusch &amp; Nambisan, 2015). Su función es hacer más eficiente el intercambio de servicio, porque ayuda a que los recursos sean más fáciles de compartir y de encontrar cuando se necesitan.</p><p>En Grupo Alme, la plataforma no es solo tecnología. Incluye los espacios físicos, el personal, los menús, los proveedores y los canales por los que el cliente se comunica con el grupo, como Google, WhatsApp o Instagram para reservar.</p><h3>Arquitectura modular</h3><p>Una arquitectura modular significa que la plataforma está formada por módulos o piezas que se pueden combinar, cambiar o ampliar sin rediseñar todo el sistema. Esto permite coordinar muchos intercambios de servicio de manera escalable y genera más oportunidades de co-creación de valor (Hein et al., 2019). A cambio, necesita reglas de gobierno que definan cómo interactúan sus participantes (Hein et al., 2019).</p><p>En Grupo Alme se puede interpretar que cada concepto funciona como un módulo: tiene su propia cocina, diseño y ambiente, pero se apoya en elementos comunes, como los valores de atender, compartir y servir, la capacitación del personal, los proveedores y los canales de reservación.</p><h3>Protocolos de intercambio</h3><p>Los protocolos de intercambio son las reglas, los estándares y las formas acordadas que permiten que los actores intercambien recursos de manera ordenada: qué se pide, quién lo hace y cómo se hace. Cuando los actores comparten estándares o una misma lógica institucional, se ponen de acuerdo más rápido (Lusch &amp; Nambisan, 2015, como se citó en Hein et al., 2019). Estas reglas se relacionan con la premisa FP11 sobre instituciones (Vargo &amp; Lusch, 2016).</p><div class=tw><table><tr><th>Protocolo</th><th>Actores</th><th>En Grupo Alme</th></tr><tr><td>Reservación</td><td>Cliente y personal de reservaciones</td><td>Reserva por Google, WhatsApp o Instagram y recibe una confirmación.</td></tr><tr><td>Recepción y acceso</td><td>Cliente, recepcionista o cadenero</td><td>En el restaurante lo reciben y lo llevan a su mesa; en el antro se anota en la lista, espera en la fila y pasa una revisión de seguridad.</td></tr><tr><td>Pedido y servicio</td><td>Cliente, mesero, cocina o barra</td><td>El mesero recomienda y toma el pedido, y lo comunica a cocina o barra.</td></tr><tr><td>Reglas del concepto</td><td>Cliente y empresa</td><td>Reservaciones y código de vestimenta ordenan la experiencia.</td></tr></table></div>"],
["Co-creación","6. Ecosistemas: co-creación","<p>La co-creación de valor parte de la idea de que el valor no lo produce solo la empresa, sino que se construye entre varios actores, siempre incluyendo al beneficiario (Vargo &amp; Lusch, 2008, 2016). Payne et al. (2008) la estudian como un proceso que se puede entender y gestionar, y Prahalad y Ramaswamy (2004) la relacionan con las experiencias que el cliente construye junto con la empresa. En el marco de Lusch y Nambisan (2015), es el tercer elemento del modelo, junto con los ecosistemas y las plataformas.</p><h3>Integración de recursos</h3><p>Cada actor aporta recursos que se combinan para generar valor. Lusch y Nambisan (2015) explican que el valor se co-crea entre quien ofrece el servicio y quien lo recibe mediante la integración de recursos, materiales o intangibles (Vargo &amp; Lusch, 2008). En Grupo Alme, el chef combina ingredientes con su técnica, el mesero su conocimiento del menú con la atención, y el cliente su tiempo, sus gustos y la ocasión que celebra.</p><h3>Participación de actores</h3><p>Aunque el cliente es el actor más visible, también intervienen la empresa, los empleados, los proveedores y otros clientes, que influyen en el ambiente. La plataforma debe dar transparencia sobre quiénes son los actores y qué pueden hacer (Hein et al., 2019). Quienes reciben el servicio pueden ser ideadores, diseñadores o intermediarios (Lusch &amp; Nambisan, 2015, como se citó en Hein et al., 2019): en Alme, el cliente que comenta lo que le gustaría, el que combina platillos a su gusto o el que recomienda el lugar y comparte su experiencia en redes.</p><h3>Cliente como participante activo</h3><p>Desde la lógica dominante del servicio, el cliente nunca es un receptor pasivo, sino alguien que contribuye a crear el valor (Vargo &amp; Lusch, 2008). Payne et al. (2008) destacan la importancia de entender cómo se involucran los clientes. En Grupo Alme participa en cada etapa: elige y reserva, llega y se integra al ambiente, pide y personaliza, y comparte su opinión.</p><h3>Creación conjunta de experiencias, soluciones y valor</h3><div class=ax><b>Experiencias.</b> Prahalad y Ramaswamy (2004) plantean que el valor se concentra cada vez más en experiencias que el consumidor construye junto con la empresa. La noche que vive cada cliente nace del ambiente que ofrece Alme y de cómo decide vivirlo.</div><div class=ax><b>Soluciones.</b> Cuando el personal escucha una necesidad y adapta el servicio, se crea una solución a la medida, como recomendar platillos según los gustos de la mesa o ajustar la atención para una ocasión especial.</div><div class=ax><b>Valor.</b> Se concreta cuando el cliente usa el servicio y lo percibe de manera única (Vargo &amp; Lusch, 2016, FP10). Una misma cena puede ser inolvidable para unos y común para otros.</div><p>En conjunto, la plataforma ofrece la estructura, los protocolos ordenan el intercambio y los actores participan integrando recursos para crear juntos experiencias, soluciones y valor.</p>"],
["Referencias","Referencias bibliográficas","<p style='text-align:left'>Grupo Alme. (2026, 23 de septiembre). <i>Noticias septiembre</i>. https://grupoalme.mx/noticias-septiembre/</p><p style='text-align:left'>Hein, A., Weking, J., Schreieck, M., Wiesche, M., Böhm, M., &amp; Krcmar, H. (2019). Value co-creation practices in business-to-business platform ecosystems. <i>Electronic Markets, 29</i>(3), 503–518. https://doi.org/10.1007/s12525-019-00337-y</p><p style='text-align:left'>Lusch, R. F., &amp; Nambisan, S. (2015). Service innovation: A service-dominant logic perspective. <i>MIS Quarterly, 39</i>(1), 155–175. https://doi.org/10.25300/MISQ/2015/39.1.07</p><p style='text-align:left'>Payne, A. F., Storbacka, K., &amp; Frow, P. (2008). Managing the co-creation of value. <i>Journal of the Academy of Marketing Science, 36</i>(1), 83–96. https://doi.org/10.1007/s11747-007-0070-0</p><p style='text-align:left'>Pine, B. J., II, &amp; Gilmore, J. H. (1998). Welcome to the experience economy. <i>Harvard Business Review, 76</i>(4), 97–105.</p><p style='text-align:left'>Prahalad, C. K., &amp; Ramaswamy, V. (2004). Co-creation experiences: The next practice in value creation. <i>Journal of Interactive Marketing, 18</i>(3), 5–14.</p><p style='text-align:left'>Riviera Maya News. (s. f.). <i>New in Cancún: La Madalena by Grupo Alme unveiled</i>. https://www.rivieramayanews.mx/?p=4289</p><p style='text-align:left'>Vargo, S. L., &amp; Lusch, R. F. (2004). Evolving to a new dominant logic for marketing. <i>Journal of Marketing, 68</i>(1), 1–17.</p><p style='text-align:left'>Vargo, S. L., &amp; Lusch, R. F. (2008). Service-dominant logic: Continuing the evolution. <i>Journal of the Academy of Marketing Science, 36</i>(1), 1–10.</p><p style='text-align:left'>Vargo, S. L., &amp; Lusch, R. F. (2016). Institutions and axioms: An extension and update of service-dominant logic. <i>Journal of the Academy of Marketing Science, 44</i>(1), 5–23.</p><p style='text-align:left'>Zeithaml, V. A., Parasuraman, A., &amp; Berry, L. L. (1985). Problems and strategies in services marketing. <i>Journal of Marketing, 49</i>(2), 33–46.</p>"]];

function route(){

  $("#n0").className=h==="inicio"?"on":"";$("#n1").className=h==="manual"||/^p\d+$/.test(h)?"on":"";$("#n2").className=h==="locales"||h.startsWith("r-")?"on":"";

}
